# Analyzer and lint settings. `flutter analyze` must report no issues.
# The Flutter lints plus a few stricter rules (docs/04-architecture.md §7).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - lib/**/*.g.dart
    - packages/**/android/**

linter:
  rules:
    # A fire-and-forget future must say so with unawaited(...), so a missing
    # await (and its lost errors) can't slip through.
    - unawaited_futures
    - discarded_futures
    # Streams and sinks that are opened must be closed.
    - cancel_subscriptions
    - close_sinks
    - avoid_dynamic_calls
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - avoid_print
