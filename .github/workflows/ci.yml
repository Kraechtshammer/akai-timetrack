# Checks every push to main and every pull request: analyzer and unit tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Flutter version as the dev container (.devcontainer/Dockerfile).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Berlin time, so tests see daylight saving changes (UTC has none).
      - run: flutter test
        env:
          TZ: Europe/Berlin
