# Builds the signed release APK and publishes it as a GitHub release.
#
# Release: set `version:` in pubspec.yaml (e.g. 1.0.1+2), commit, then
#   git tag v1.0.1 && git push origin v1.0.1
# The tag must match the pubspec version. Can also be started by hand in the Actions tab
# (it then uses the pubspec version and creates the tag itself).
#
# Needs these repository secrets (Settings › Secrets and variables › Actions), see
# docs/03-dev-setup.md "Releases":
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key use the same one)
#   ANDROID_KEY_ALIAS          the key alias (timetrack)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          name=${full%%+*}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec version $full (expected v$name)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same Flutter version as the dev container (.devcontainer/Dockerfile).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Without the key the APK would be signed with a throwaway debug key and couldn't
          # update the installed app, so stop here instead.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing (see docs/03-dev-setup.md, Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/timetrack-release.jks
          {
            echo "storeFile=timetrack-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - run: flutter build apk --release

      - name: Check the APK is signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "timetrack-${{ steps.version.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TimeTrack ${{ steps.version.outputs.name }}
          files: timetrack-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/timetrack-release.jks android/key.properties
