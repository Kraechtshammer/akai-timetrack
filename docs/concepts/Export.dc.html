<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Export</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0}
a{color:#8F4C38}a:hover{color:#723523}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;letter-spacing:normal;text-transform:none;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
button{font-family:inherit}
.tn{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF8F6; color: #231917; font-family: 'Roboto Flex', Roboto, sans-serif; overflow: hidden;">
  <header style="display: flex; align-items: flex-start; justify-content: space-between; padding: 32px 8px 0 20px;">
    <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 16px;">
      <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.3px;">Export</h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #53433F;">Arbeitszeiten für den Chef</p>
    </div>
    <a href="Settings.dc.html" aria-label="Einstellungen" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #53433F; text-decoration: none;"><span class="ms" aria-hidden="true">settings</span></a>
  </header>

  <main style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 16px;">
    <div style="height: 56px; border-radius: 28px; background: #FCEAE5; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; flex-shrink: 0;">
      <button type="button" aria-label="Vorherige Woche" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: transparent; color: #53433F; display: flex; align-items: center; justify-content: center; cursor: pointer;"><span class="ms" aria-hidden="true">chevron_left</span></button>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <span style="font-size: 16px; line-height: 22px; font-weight: 650;">KW 44</span>
        <span style="font-size: 12px; line-height: 16px; color: #53433F;">26. Okt. – 1. Nov.</span>
      </div>
      <button type="button" aria-label="Nächste Woche" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: transparent; color: #53433F; display: flex; align-items: center; justify-content: center; cursor: pointer;"><span class="ms" aria-hidden="true">chevron_right</span></button>
    </div>

    <section aria-label="Wochensumme" style="background: #FFDBD1; color: #3A0B01; border-radius: 28px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #723523;">Woche gesamt</span>
        <span class="tn" style="font-size: 44px; line-height: 52px; font-weight: 750; letter-spacing: -1px;">29,0 h</span>
      </div>
      <span style="font-size: 14px; line-height: 20px; color: #723523; text-align: right;">6 Schichten<br>an 5 Tagen</span>
    </section>

    <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 650; color: #53433F;">Vorschau</span>
      <p class="tn" style="margin: 0; background: #FCEAE5; border-radius: 20px; padding: 14px 16px; font-size: 14px; line-height: 22px; white-space: pre-line;">{{text}}</p>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; min-height: 56px; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; flex-grow: 1;">
        <span id="mt" style="font-size: 16px; line-height: 24px; font-weight: 500;">Monatssummen anhängen</span>
        <span style="font-size: 12px; line-height: 16px; color: #53433F;">Die Woche umfasst Oktober und November</span>
      </div>
      <sc-if value="{{monthOn}}" hint-placeholder-val="{{true}}">
        <button type="button" role="switch" aria-checked="true" aria-labelledby="mt" onClick="{{toggleMonth}}" style="width: 52px; height: 32px; border-radius: 16px; border: none; background: #8F4C38; padding: 0 4px; display: flex; align-items: center; justify-content: flex-end; cursor: pointer; flex-shrink: 0;"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; color: #8F4C38; display: flex; align-items: center; justify-content: center;"><span class="ms" aria-hidden="true" style="font-size: 16px;">check</span></span></button>
      </sc-if>
      <sc-if value="{{monthOff}}" hint-placeholder-val="{{false}}">
        <button type="button" role="switch" aria-checked="false" aria-labelledby="mt" onClick="{{toggleMonth}}" style="width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 2px solid #85736E; background: #F1DFDA; padding: 0 6px; display: flex; align-items: center; justify-content: flex-start; cursor: pointer; flex-shrink: 0;"><span style="width: 16px; height: 16px; border-radius: 8px; background: #85736E;"></span></button>
      </sc-if>
    </div>

    <div style="display: flex; gap: 8px; flex-shrink: 0;">
      <button type="button" onClick="{{copy}}" style="flex: 1 1 0; height: 56px; border-radius: 28px; border: none; background: #FFDBD1; color: #723523; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 650; cursor: pointer;"><span class="ms" aria-hidden="true" style="font-size: 22px;">{{copyIcon}}</span>{{copyLabel}}</button>
      <button type="button" style="flex: 1 1 0; height: 56px; border-radius: 28px; border: none; background: #8F4C38; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 650; cursor: pointer;"><span class="ms" aria-hidden="true" style="font-size: 22px;">share</span>Teilen</button>
    </div>
  </main>

  <nav aria-label="Hauptnavigation" style="height: 80px; flex-shrink: 0; box-sizing: border-box; background: #FCEAE5; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 0 16px;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #53433F;">
      <span style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center;"><span class="ms" aria-hidden="true">today</span></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500;">Heute</span>
    </a>
    <a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #53433F;">
      <span style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center;"><span class="ms" aria-hidden="true">calendar_month</span></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500;">Plan</span>
    </a>
    <a href="Export.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #231917;">
      <span style="width: 56px; height: 32px; border-radius: 16px; background: #FFDBD1; color: #5D4037; display: flex; align-items: center; justify-content: center;"><span class="ms f" aria-hidden="true">send</span></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 700;">Export</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { monthOn: true, copied: false };
  }
  renderVals() {
    const lines = [
      'Arbeitszeiten KW 44 (26.10.–01.11.2026)',
      'Mo 26.10.: 12:00–16:00 (4,0 h)',
      'Mi 28.10.: 17:30–23:15 (5,75 h)',
      'Fr 30.10.: 12:00–15:30 (3,5 h), 17:30–23:00, 30 min Pause (5,0 h)',
      'Sa 31.10.: 17:30–22:45 (5,25 h)',
      'So 01.11.: 17:30–23:00 (5,5 h)',
      'Woche gesamt: 29,0 h'
    ];
    if (this.state.monthOn) {
      lines.push('Oktober gesamt: 86,25 h');
      lines.push('November bisher: 5,5 h');
    }
    return {
      text: lines.join('\n'),
      monthOn: this.state.monthOn,
      monthOff: !this.state.monthOn,
      toggleMonth: () => this.setState({ monthOn: !this.state.monthOn, copied: false }),
      copy: () => this.setState({ copied: true }),
      copyIcon: this.state.copied ? 'check' : 'content_copy',
      copyLabel: this.state.copied ? 'Kopiert' : 'Kopieren'
    };
  }
}
</script>
</body>
</html>
