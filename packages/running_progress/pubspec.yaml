name: running_progress
description: "Keeps the progress bar of the running-shift notification up to date (Android 16: as a Live Update)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: de.garten.running_progress
        pluginClass: RunningProgressPlugin
